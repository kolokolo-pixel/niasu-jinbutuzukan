  if (failed.length) msg.push("読み込めなかった画像：" + failed.join("、"));
  noticeEl.textContent = msg.join("　／　");
};
$("migrate").onclick = async function(){
  var todo = cards.filter(function(c){ return !c.a && c.img; });
  for (var i = 0; i < todo.length; i++){
    var c = todo[i]; setStatus("画像を移動中 " + (i+1) + " / " + todo.length);
    try {
      var bin = atob(c.img.split(",")[1]), arr = new Uint8Array(bin.length);
      for (var k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
      var res = await assetsNS.upload(new Blob([arr], {type:"image/jpeg"}), {type:"image/jpeg"});
      c.a = res.id; delete c.img;
    } catch(e){ setStatus("途中で止まりました（" + (i) + " / " + todo.length + "）。もう一度押してください"); return; }
  }
  changed = true; await save().catch(function(){});
};

/* ---------- reorder (buttons + drag) ---------- */
var armedBtn = null;
list.addEventListener("click", function(e){
  var b = e.target.closest("button.mv"); if (!b) return;
  var row = b.closest(".row");
  if (b.classList.contains("up") && row.previousElementSibling) list.insertBefore(row, row.previousElementSibling);
  else if (b.classList.contains("dn") && row.nextElementSibling) list.insertBefore(row, row.nextElementSibling.nextSibling);
  else if (b.classList.contains("del")){
    if (armedBtn !== b){
      armedBtn = b; b.textContent = "本当に？";
      setTimeout(function(){ if (armedBtn === b){ b.textContent = "削除"; armedBtn = null; } }, 3000);
      return;
    }
    armedBtn = null; row.remove();
  } else return;
  commit();
  if (!b.classList.contains("del")) row.scrollIntoView({block:"nearest"});
});
$("addSec").onclick = function(){
  var it = {k:"s", sid:"s" + Date.now().toString(36) + Math.floor(Math.random()*1000).toString(36), label:""};
  itemByKey[it.sid] = it;
  var row = buildRow(it); list.insertBefore(row, list.firstChild); list.scrollTop = 0;
  commit(); row.querySelector(".lb").focus();
};
var drag = null;
function reposition(){
  var d = drag, row = d.row, lr = list.getBoundingClientRect();
  if (d.y < lr.top + 50) list.scrollTop -= Math.max(2, (lr.top + 50 - d.y)/4);
  else if (d.y > lr.bottom - 50) list.scrollTop += Math.max(2, (d.y - (lr.bottom - 50))/4);
  row.style.transform = "";
  var nat = row.getBoundingClientRect(), center = d.y - d.grab + nat.height/2;
  var prev = row.previousElementSibling, next = row.nextElementSibling, rc;
  while (prev){ rc = prev.getBoundingClientRect();
    if (center < rc.top + rc.height/2){ list.insertBefore(row, prev); prev = row.previousElementSibling; } else break; }
  while (next){ rc = next.getBoundingClientRect();
    if (center > rc.top + rc.height/2){ list.insertBefore(row, next.nextSibling); next = row.nextElementSibling; } else break; }
  nat = row.getBoundingClientRect();
  row.style.transform = "translateY(" + (d.y - d.grab - nat.top) + "px)";
}
function tick(){ if (!drag) return; reposition(); drag.raf = requestAnimationFrame(tick); }
list.addEventListener("pointerdown", function(e){
  var g = e.target.closest(".grip"); if (!g) return;
  e.preventDefault();
  var row = g.closest(".row"), r = row.getBoundingClientRect();
  try { g.setPointerCapture(e.pointerId); } catch(err){}
  drag = {row:row, grab:e.clientY - r.top, y:e.clientY, raf:0};
  row.classList.add("drag"); tick();
});
list.addEventListener("pointermove", function(e){ if (drag) drag.y = e.clientY; });
function endDrag(){
  if (!drag) return;
  cancelAnimationFrame(drag.raf);
  drag.row.style.transform = ""; drag.row.classList.remove("drag");
  drag = null; commit();
}
list.addEventListener("pointerup", endDrag);
list.addEventListener("pointercancel", endDrag);


/* ---------- start ---------- */
renderTrack(); update();
(async function(){
  if (!window.claude || !window.claude.use) return;
  try { var u = await claude.use("user"); isOwner = u ? await u.isOwner() : false; } catch(e){}
  if (!isOwner) return;
  try { artifactNS = await claude.use("artifact"); } catch(e){}
  try { assetsNS = await claude.use("assets"); } catch(e){}
  if (artifactNS) editBtn.hidden = false;
})();
